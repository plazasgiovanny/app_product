name: CI – Build, Unit Tests & Architecture Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  DOTNET_VERSION: "9.0.x"
  SOLUTION: "App_product.sln"

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Compilación con TreatWarningsAsErrors
  # ------------------------------------------------------------------
  build:
    name: Build (warnings-as-errors)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar paquetes NuGet
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Compilar solución (warnaserror)
        run: >
          dotnet build ${{ env.SOLUTION }}
          --no-restore
          --configuration Release
          -p:TreatWarningsAsErrors=true

  # ------------------------------------------------------------------
  # JOB 2: Pruebas unitarias (Application.Tests)
  # ------------------------------------------------------------------
  unit-tests:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    needs: build
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar paquetes NuGet
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Ejecutar pruebas unitarias
        run: >
          dotnet test tests/App_product.Application.Tests/App_product.Application.Tests.csproj
          --no-restore
          --configuration Release
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory ./test-results

      - name: Publicar resultados de pruebas unitarias
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "Resultados – Pruebas Unitarias"
          path: "./test-results/unit-tests.trx"
          reporter: dotnet-trx
          fail-on-error: true

  # ------------------------------------------------------------------
  # JOB 3: Pruebas de arquitectura (ArchTests)
  # ------------------------------------------------------------------
  arch-tests:
    name: Pruebas de arquitectura
    runs-on: ubuntu-latest
    needs: build
    permissions:
      checks: write
      contents: read

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar paquetes NuGet
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Ejecutar pruebas de arquitectura
        run: >
          dotnet test tests/App_product.ArchTests/App_product.ArchTests.csproj
          --no-restore
          --configuration Release
          --logger "trx;LogFileName=arch-tests.trx"
          --results-directory ./test-results

      - name: Publicar resultados de pruebas de arquitectura
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "Resultados – Pruebas de Arquitectura"
          path: "./test-results/arch-tests.trx"
          reporter: dotnet-trx
          fail-on-error: true
